[test]
preload = ["./tests/dom-globals.ts", "./tests/setup.ts"]
exclude = ["dist/**", "node_modules/**", "coverage/**"]
mockClear = true
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
# Bun reports a non-zero exit for detailed thresholds despite passing
# aggregate coverage; the shared CI script enforces the 80% aggregate minimum.
coverageThreshold = 0
