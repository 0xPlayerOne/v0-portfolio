name: Portfolio Regression Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      baseline:
        description: Commit or ref to compare against the selected workflow revision
        required: true
        default: a3c43a0abe578513b338ea253c167c9776e89b13
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Mobile and desktop browser regression checks
        run: bunx playwright test
      - name: Compare immutable revisions on the same runner
        if: github.event_name == 'workflow_dispatch'
        env:
          BASELINE_REF: ${{ inputs.baseline }}
        run: bun run performance:compare --base "$BASELINE_REF" --head "$GITHUB_SHA" --runs 3
      - name: Publish comparison summary
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          if test -f artifacts/performance/comparison/summary.md; then
            cat artifacts/performance/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-regression-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
