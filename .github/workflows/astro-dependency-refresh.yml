name: Astro Dependency Validation

on:
  push:
    branches: [refactor/astro-portfolio]
    paths: [.github/workflows/astro-dependency-refresh.yml]

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == '0xPlayerOne/v0-portfolio'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Update the two vulnerable existing overrides
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          pkg.overrides['js-yaml'] = '4.3.2'
          pkg.overrides.sharp = '0.35.4'
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          bun install
          bun audit
          bun run fmt
      - name: Commit the resolved lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: patch js-yaml and sharp overrides flagged by dependency audit'
          git push origin HEAD:refactor/astro-portfolio
      - name: Validate source and build
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test:coverage
          bun run build
      - name: Browser regression checks
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test
      - name: Repeat the paired benchmark with the patched lockfile
        run: bun run performance:compare --base a3c43a0abe578513b338ea253c167c9776e89b13 --runs 3
      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-patched-validation
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
