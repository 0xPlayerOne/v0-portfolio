name: Cloudflare Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft]

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Cloudflare Preview / v0-portfolio
    # Dependabot-triggered runs receive secrets from the Dependabot store only,
    # never from Actions (see github.com/docs "Troubleshoot Dependabot on GitHub
    # Actions"), so the deploy step fails on CLOUDFLARE_API_TOKEN even though the
    # build succeeds. Skip previews for Dependabot PRs until
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are mirrored as Dependabot
    # secrets, which restores preview deployments for them.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    uses: 0xPlayerOne/code-foundry/.github/workflows/cloudflare-deploy.yml@v1.44.3
    with:
      mode: preview
      working-directory: .
      install-working-directory: .
      build-script: cloudflare:build
      bun-version: 1.4.0
      environment: Preview - v0-portfolio
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
