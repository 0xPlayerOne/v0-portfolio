name: Astro Migration Validation

on:
  push:
    branches: [refactor/astro-portfolio]
    paths: [scripts/migrate-to-astro.mjs]

permissions:
  contents: write

concurrency:
  group: astro-migration-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == '0xPlayerOne/v0-portfolio'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Generate the migration on the topic branch
        run: node scripts/migrate-to-astro.mjs
      - name: Resolve the existing Bun lockfile
        id: dependencies
        run: bun install
      - name: Format and commit migration source and lockfile
        run: |
          bun run fmt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --stat
          git commit -m 'refactor: migrate portfolio to Astro islands and add performance comparisons'
          git push origin HEAD:refactor/astro-portfolio
      - name: Formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run lint
      - name: Type checking
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run typecheck
      - name: Existing and migration unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run test:coverage
      - name: Production static build and Worker dry run
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run build
      - name: Browser regression checks and screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test
      - name: Same-runner Next.js versus Astro comparison
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run performance:compare --base a3c43a0abe578513b338ea253c167c9776e89b13 --runs 3
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-migration-validation
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
