name: Code Foundry

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, Format, Lint & Type Check
    if: github.event_name != 'pull_request' || github.head_ref != 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type:check
      - name: Build
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
